{% extends "base.html" %}

{% block title %}Edit Expense - Expense Tracker{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Expense</h1>

        <p class="muted">
            Update the details of your expense.
        </p>
    </div>

    <a
        href="{{ url_for('expenses') }}"
        class="button secondary"
    >
        Back to Expenses
    </a>

</div>


<div class="card form-card">

    <form method="POST">

        <div class="form-group">

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0.01"
                value="{{ expense['amount'] }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
                required
            >

                <option
                    value="Food"
                    {% if expense["category"] == "Food" %}selected{% endif %}
                >
                    Food
                </option>

                <option
                    value="Travel"
                    {% if expense["category"] == "Travel" %}selected{% endif %}
                >
                    Travel
                </option>

                <option
                    value="Shopping"
                    {% if expense["category"] == "Shopping" %}selected{% endif %}
                >
                    Shopping
                </option>

                <option
                    value="Bills"
                    {% if expense["category"] == "Bills" %}selected{% endif %}
                >
                    Bills
                </option>

                <option
                    value="Education"
                    {% if expense["category"] == "Education" %}selected{% endif %}
                >
                    Education
                </option>

                <option
                    value="Health"
                    {% if expense["category"] == "Health" %}selected{% endif %}
                >
                    Health
                </option>

                <option
                    value="Entertainment"
                    {% if expense["category"] == "Entertainment" %}selected{% endif %}
                >
                    Entertainment
                </option>

                <option
                    value="Other"
                    {% if expense["category"] == "Other" %}selected{% endif %}
                >
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <input
                type="text"
                id="description"
                name="description"
                value="{{ expense['description'] }}"
                maxlength="200"
                required
            >

        </div>


        <div class="form-group">

            <label for="expense_date">
                Date
            </label>

            <input
                type="date"
                id="expense_date"
                name="expense_date"
                value="{{ expense['expense_date'] }}"
                required
            >

        </div>


        <div class="form-actions">

            <button type="submit">
                Save Changes
            </button>

            <a
                href="{{ url_for('expenses') }}"
                class="button secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
