{% extends "base.html" %}

{% block title %}Add Expense - Expense Tracker{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Expense</h1>

        <p class="muted">
            Record a new expense.
        </p>
    </div>

    <a
        href="{{ url_for('expenses') }}"
        class="button secondary"
    >
        Back to Expenses
    </a>

</div>


<div class="card form-card">

    <form method="POST">

        <div class="form-group">

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0.01"
                placeholder="Enter amount"
                required
            >

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
                required
            >

                <option value="">
                    Select a category
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Health">
                    Health
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <input
                type="text"
                id="description"
                name="description"
                placeholder="Example: Lunch at college"
                maxlength="200"
                required
            >

        </div>


        <div class="form-group">

            <label for="expense_date">
                Date
            </label>

            <input
                type="date"
                id="expense_date"
                name="expense_date"
                value="{{ today }}"
                required
            >

        </div>


        <div class="form-actions">

            <button type="submit">
                Add Expense
            </button>

            <a
                href="{{ url_for('expenses') }}"
                class="button secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
